[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siftd"
version = "0.10.0"
description = "Personal LLM usage analytics. Ingest conversation logs from CLI coding tools, query via FTS5 and semantic search."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["llm", "analytics", "claude", "conversation", "search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "asyncssh",
    "painted>=0.4.0",
    "tomlkit",
    # Client-side HTTP: sync push/pull, serve delegation, and device-code token
    # refresh all need an HTTP client. In base (not [serve]) so a thin client
    # talking to a remote siftd-serve works without the server stack. Pure-Python
    # dependency chain (httpcore/h11/certifi/idna/sniffio) — no compiled deps.
    "httpx",
    # Markdown parsing for transcript bodies. In base (not [serve]) because the
    # terminal query/peek/show views render markdown too, not just the HTML serve
    # UI — both human-facing surfaces share this one parser (output/markdown_render
    # for the terminal, output/narrative HtmlEmitter for serve). Pure-Python, no
    # compiled deps (same philosophy as httpx above).
    "mistune>=3.0",
]

[project.scripts]
siftd = "siftd.cli:main"

[project.optional-dependencies]
embed = [
    "fastembed",
    "numpy",
    "onnxruntime",
    "tokenizers",
    "huggingface-hub",
]
serve = [
    "litestar[standard]",
    "uvicorn",
    # PyJWT[crypto] is server-only: serve/auth.py validates RS256 tokens against
    # the issuer's JWKS. The client never decodes JWTs (credentials.py reads the
    # exp claim with a hand-rolled base64 parse, no PyJWT), so the cryptography
    # chain stays out of the base install. httpx moved to base deps.
    "PyJWT[crypto]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-xdist",
    "diff-cover",
    "prysk",
    "pytest-prysk",
    "syrupy",
    "ruff>=0.4",
    "ty",
    "chardet<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/siftd"]

[tool.hatch.build.targets.wheel.force-include]
"plugin" = "siftd/plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-n auto"
markers = [
    "embeddings: tests that require embedding dependencies",
    "serve: tests that require serve dependencies",
    "slow: tests that take >10s (excluded from default runs)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ty.src]
exclude = ["bench/**"]

[tool.ty.rules]
# Ignore unresolved imports for optional dependencies
unresolved-import = "ignore"
