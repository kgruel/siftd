[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siftd"
version = "0.8.0"
description = "Personal LLM usage analytics. Ingest conversation logs from CLI coding tools, query via FTS5 and semantic search."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["llm", "analytics", "claude", "conversation", "search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "asyncssh",
    "painted>=0.1.7",
    "tomlkit",
]

[project.scripts]
siftd = "siftd.cli:main"

[project.optional-dependencies]
embed = [
    "fastembed",
    "numpy",
    "onnxruntime",
    "tokenizers",
    "huggingface-hub",
]
serve = [
    "litestar[standard]",
    "uvicorn",
    "httpx",
    "PyJWT[crypto]",
    "mistune>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-xdist",
    "diff-cover",
    "prysk",
    "pytest-prysk",
    "syrupy",
    "ruff>=0.4",
    "ty",
    "chardet<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/siftd"]

[tool.hatch.build.targets.wheel.force-include]
"plugin" = "siftd/plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-n auto"
markers = [
    "embeddings: tests that require embedding dependencies",
    "serve: tests that require serve dependencies",
    "slow: tests that take >10s (excluded from default runs)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ty.src]
exclude = ["bench/**"]

[tool.ty.rules]
# Ignore unresolved imports for optional dependencies
unresolved-import = "ignore"
