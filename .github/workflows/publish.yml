name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.4.3)'
        required: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  update-homebrew:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate formula from PyPI API
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ -n "${{ inputs.tag }}" ]; then VERSION="${{ inputs.tag }}"; VERSION=${VERSION#v}; fi
          echo "Generating formula for siftd $VERSION..."

          # Wait for PyPI JSON API to serve the new version
          for i in {1..30}; do
            HTTP_CODE=$(python3 -c "
          import urllib.request, sys
          try:
              r = urllib.request.urlopen('https://pypi.org/pypi/siftd/${VERSION}/json')
              sys.stdout.write(str(r.status))
          except urllib.error.HTTPError as e:
              sys.stdout.write(str(e.code))
          ")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "PyPI API reports siftd $VERSION available"
              break
            fi
            echo "Attempt $i: PyPI API returned $HTTP_CODE, waiting 10s..."
            sleep 10
          done

          [ "$HTTP_CODE" = "200" ] || { echo "ERROR: siftd $VERSION not found on PyPI after 5 minutes"; exit 1; }

          # Generate formula directly from PyPI JSON API (no poet/pkg_resources dependency)
          # Unquoted heredoc so shell expands ${VERSION} before Python runs
          python3 << PYEOF > siftd.rb
          import json, urllib.request

          VERSION = "${VERSION}"

          with urllib.request.urlopen(f"https://pypi.org/pypi/siftd/{VERSION}/json") as r:
              pkg = json.loads(r.read())

          sdist = next(f for f in pkg["urls"] if f["packagetype"] == "sdist")

          requires = pkg["info"].get("requires_dist") or []
          deps = [r.split()[0].rstrip(";") for r in requires if ";" not in r and "extra ==" not in r]

          resources = []
          for dep in deps:
              with urllib.request.urlopen(f"https://pypi.org/pypi/{dep}/json") as dr:
                  dp = json.loads(dr.read())
              ds = next((f for f in dp["urls"] if f["packagetype"] == "sdist"), None)
              if ds:
                  resources.append((dep, ds["url"], ds["digests"]["sha256"]))

          lines = [
              'class Siftd < Formula',
              '  include Language::Python::Virtualenv',
              '',
              '  desc "Personal LLM usage analytics for CLI coding tools"',
              '  homepage "https://github.com/kgruel/siftd"',
              f'  url "{sdist["url"]}"',
              f'  sha256 "{sdist["digests"]["sha256"]}"',
              '  license "MIT"',
              '',
              '  depends_on "python@3.12"',
              '',
          ]

          for name, url, sha in resources:
              lines += [
                  f'  resource "{name}" do',
                  f'    url "{url}"',
                  f'    sha256 "{sha}"',
                  '  end',
                  '',
              ]

          lines += [
              '  def install',
              '    virtualenv_create(libexec, "python3.12")',
              '    virtualenv_install_with_resources',
              '  end',
              '',
              '  test do',
              '    assert_match "usage", shell_output("siftd --help", 0)',
              '  end',
              'end',
          ]

          print("\n".join(lines))
          PYEOF

          echo "Generated formula:"
          cat siftd.rb
          grep -q "siftd-${VERSION}" siftd.rb || { echo "ERROR: formula does not contain version $VERSION"; exit 1; }

      - name: Push to tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/kgruel/homebrew-siftd.git tap
          cp siftd.rb tap/Formula/siftd.rb 2>/dev/null || { mkdir -p tap/Formula && cp siftd.rb tap/Formula/siftd.rb; }
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/siftd.rb
          TAG=${GITHUB_REF#refs/tags/}
          if [ -n "${{ inputs.tag }}" ]; then TAG="${{ inputs.tag }}"; fi
          git diff --cached --quiet || git commit -m "Update siftd to ${TAG}"
          git push
