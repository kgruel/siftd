name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  # Local near-equivalent: ./dev check (includes docs; local lint auto-fixes while CI only checks)
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"

      - name: Run type check
        run: uv run ty check src/

      - name: Run lint
        run: uv run ruff check src/

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short -m "not embeddings and not serve and not slow"

  # Local equivalent: ./dev test-embed
  test-with-embeddings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies with embeddings
        run: uv sync --extra dev --extra embed --extra serve

      - name: Cache fastembed models
        uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-bge-small-en-v1.5-${{ runner.os }}

      - name: Run embedding tests
        run: uv run pytest tests/ -v --tb=short -m embeddings

  # Local equivalent: ./dev test-serve
  test-with-serve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies with serve
        run: uv sync --extra dev --extra serve

      - name: Run serve tests
        run: uv run pytest tests/ -v --tb=short -m "serve and not embeddings"

  # Local equivalent: ./dev docs --check
  # Full extras so api.md generates (optional deps missing = a skipped target,
  # which --strict treats as a hard failure rather than a false green).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies with all extras
        run: uv sync --extra dev --extra embed --extra serve

      - name: Check docs are current
        run: ./dev docs --check

  # Local equivalent: ./dev test-slow
  # Publish invokes this reusable workflow; keep slow tests out of PR CI.
  test-slow:
    if: github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"

      - name: Run slow tests
        run: uv run pytest tests/ -v --tb=short -m slow
