# siftd pricing reference — the version-controlled source of truth for model prices.
#
# A price is REFERENCE DATA: a fact about (model, provider), identical on every machine,
# sourced externally. The `pricing` SQLite table is a PROJECTION of this file (plus the
# user override at ~/.config/siftd/pricing.toml), rebuilt on every DB open via UPSERT —
# it is never frozen and never synced between machines. To correct a price, edit it here
# (or in the override file) and reopen the DB; the next ingest reprices the corpus.
#
# Each entry:
#   model       canonical model name (must match models.name — see siftd/model_names.py)
#   provider    provider name (anthropic | openai | google | ...)
#   input_per_mtok / output_per_mtok   USD per million tokens (base / standard tier)
#   cache_read_per_mtok / cache_creation_per_mtok   OPTIONAL override; omit to derive
#               from input_per_mtok via the standard Anthropic multiple (read ×0.1,
#               creation ×1.25 for the 5-minute cache write — both verified against the
#               Anthropic pricing page). Set only for a provider whose cache differs.
#   source      provenance: a citation URL, or an honest note
#   as_of       date the value was last verified (YYYY-MM-DD)
#
# Unknown ≠ free: a model with no entry here (and no override) stays UNPRICED (cost NULL,
# rendered "—"), never a fabricated $0. Add real published values rather than guessing.
#
# Tiered pricing (e.g. Gemini >200k-token prompts, Anthropic 1h vs 5m cache writes) is
# NOT yet modeled — these use the base/standard tier. See the deferred notes at the end.

