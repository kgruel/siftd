# siftd pricing reference — the version-controlled source of truth for model prices.
#
# A price is REFERENCE DATA: a fact about (model, provider), identical on every machine,
# sourced externally. The `pricing` SQLite table is a PROJECTION of this file (plus the
# user override at ~/.config/siftd/pricing.toml), rebuilt on every DB open via UPSERT.
# It is never frozen and never synced between machines. To correct a price, pin it here
# or set it in the override file, then reopen the DB; the next ingest reprices the corpus.
#
# OWNERSHIP. Entries below the marker line are generated by `./dev pricing-sync`
# (scripts/pricing_sync.py) from https://models.dev/api.json. The sync is a release step,
# not a CI step: a tag must publish exactly what a person reviewed, and the publish path
# must not depend on a third-party fetch (see .claude/skills/release/SKILL.md).
#   - anthropic, openai, google: owned by the sync, except pinned entries.
#   - any other provider: kept verbatim by the sync.
#   - an owned entry no longer listed upstream is kept, not deleted (old logs still need a
#     price), and the sync reports it.
# Hand edits below the marker are overwritten on the next sync. Use a pin or the override.
#
# Each entry:
#   model       canonical model name (must match models.name — see siftd/model_names.py)
#   provider    provider name (anthropic | openai | google | ...)
#   pinned      OPTIONAL, default false. `pinned = true` freezes the entry: the sync never
#               modifies it and reports when upstream disagrees. Use it for a value you
#               verified by hand. siftd.pricing ignores this key; only the sync reads it.
#   input_per_mtok / output_per_mtok   USD per million tokens (base / standard tier)
#   cache_read_per_mtok / cache_creation_per_mtok   USD per million cache tokens. The sync
#               writes both from upstream; when upstream publishes no cache rate it writes
#               the input rate (no discount, no write surcharge). A hand entry that omits
#               a cache field gets it derived at cost time: read = input × 0.1 and
#               creation = input × 1.25 (the Anthropic multiples; storage/sql_helpers.py).
#               Those multiples are an approximation for any other provider.
#   source      provenance: a citation URL, or an honest note
#   as_of       date the value last changed or was first recorded (YYYY-MM-DD). The sync
#               moves it only when a price field changes or the entry is new.
#
# Unknown ≠ free: a model with no entry here (and no override) stays UNPRICED (cost NULL,
# rendered "—"), never a fabricated $0.
#
# Tiered pricing is NOT modeled. Upstream publishes context-size tiers (for example GPT
# and Gemini long-context rates); entries carry the base/standard rate only. The sync
# reports how many synced models have tiers.
#
# Per-user override: ~/.config/siftd/pricing.toml, same schema, wins per (model, provider).

# --- generated by ./dev pricing-sync: everything below this line is rewritten ---

