# GitLab CI — homelab container image build.
#
# siftd's functional CI (lint, test, PyPI publish, Homebrew tap) lives on
# GitHub Actions (.github/workflows/). This pipeline exists only on the
# gruel.network GitLab mirror (git.gruel.network/gruel/siftd) and does one
# thing: build the production `siftd serve` image and push it to the homelab
# registry so the `dev` stack can pull it.
#
# Mirrors the garden-house:build pattern in the gruel.network repo: docker:27
# + dind, login to the project registry, build the root Dockerfile, push
# :latest and :<short-sha>.
#
# CI_REGISTRY / CI_REGISTRY_IMAGE / CI_REGISTRY_USER / CI_REGISTRY_PASSWORD are
# GitLab-provided. CI_REGISTRY_IMAGE resolves to
#   registry.gruel.network/gruel/siftd
# Ensure Settings > General > Visibility > Container Registry allows
# unauthenticated pulls so deployed VMs can `docker compose pull` without creds.

stages:
  - build

image:build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      docker build \
        --cache-from "${CI_REGISTRY_IMAGE}:latest" \
        --tag "${CI_REGISTRY_IMAGE}:latest" \
        --tag "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" \
        .
      docker push "${CI_REGISTRY_IMAGE}:latest"
      docker push "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  rules:
    # Rebuild when anything that lands in the image changes.
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - Dockerfile
        - .dockerignore
        - pyproject.toml
        - uv.lock
        - src/**/*
        - plugin/**/*
        - .gitlab-ci.yml
    # Manual / scheduled trigger from the GitLab UI.
    - if: $CI_PIPELINE_SOURCE == "web"
